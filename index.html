<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Tournament Manager</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="app-shell">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="brand__mark">&#9820;</span>
      <div class="brand__text">
        <strong>EBCPCT</strong>
        <small>Tournament Manager</small>
      </div>
      <button class="sidebar__collapse" id="btn-collapse-sidebar" title="Collapse sidebar" aria-label="Collapse sidebar">&#9776;</button>
    </div>

    <div class="sidebar__tournament">
      <label for="tournament-switcher">Active tournament</label>
      <select id="tournament-switcher">
        <option value="">— Select tournament —</option>
      </select>
    </div>

    <nav class="sidebar__nav" id="sidebar-nav">
      <a href="#/dashboard" data-route="dashboard" class="nav-link"><span class="nav-ic">&#9635;</span>Dashboard</a>
      <a href="#/list" data-route="list" class="nav-link"><span class="nav-ic">&#9783;</span>Tournaments</a>
      <a href="#/new" data-route="new" class="nav-link"><span class="nav-ic">&#10133;</span>Create Tournament</a>

      <div class="nav-divider" data-needs-tournament>Current Tournament</div>
      <a href="#/players" data-route="players" class="nav-link" data-needs-tournament><span class="nav-ic">&#9823;</span>Players</a>
      <a href="#/pairings" data-route="pairings" class="nav-link" data-needs-tournament><span class="nav-ic">&#9817;</span>Pairings</a>
      <a href="#/results" data-route="results" class="nav-link" data-needs-tournament><span class="nav-ic">&#9813;</span>Round Results</a>
      <a href="#/standings" data-route="standings" class="nav-link" data-needs-tournament><span class="nav-ic">&#127942;</span>Standings</a>
      <a href="#/brackets" data-route="brackets" class="nav-link" data-needs-tournament><span class="nav-ic">&#9824;</span>Brackets</a>
      <a href="#/print" data-route="print" class="nav-link" data-needs-tournament><span class="nav-ic">&#128438;</span>Print Center</a>

      <div class="nav-divider">App</div>
      <a href="#/settings" data-route="settings" class="nav-link"><span class="nav-ic">&#9881;</span>Settings</a>
    </nav>

    <div class="sidebar__footer">
      <span id="storage-indicator" title="LocalStorage-backed, works offline">&#128190; Saved locally</span>
    </div>
  </aside>

  <button class="mobile-nav-toggle" id="btn-mobile-nav" aria-label="Toggle navigation">&#9776;</button>

  <!-- ============ Main content ============ -->
  <main class="main" id="app-main">
    <!-- Rendered by render.js -->
  </main>

</div>

<!-- Toasts -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<!-- Modal root (confirm dialogs + all app modals render here) -->
<div id="modal-root"></div>

<!-- Hidden iframe used for all print jobs, keeping print.css isolated from the live app -->
<iframe id="print-frame" title="print" style="position:fixed; width:0; height:0; border:0; visibility:hidden;"></iframe>

<script type="module" src="js/app.js"></script>
</body>
</html>
